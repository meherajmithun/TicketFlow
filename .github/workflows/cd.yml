name: Production smoke checks

# Vercel and Railway deploy from their GitHub integrations after a merge to main.
# This workflow checks the public deployment once both services have had time to update.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check web and API
        env:
          WEB_URL: https://ticket-flow-tau-drab.vercel.app
          API_URL: https://ticketflow-production-086091eb.up.railway.app
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --max-time 20 "$WEB_URL/" -o /dev/null \
              && curl --fail --silent --show-error --max-time 20 "$API_URL/health" | grep -q '"status":"ok"' \
              && curl --fail --silent --show-error --max-time 20 \
                -H "Origin: $WEB_URL" "$API_URL/events?pageSize=1" -o /dev/null; then
              echo "Production web and API are reachable"
              exit 0
            fi
            echo "Production is not ready yet (attempt $attempt/20)"
            sleep 30
          done
          echo "Production smoke checks failed"
          exit 1
