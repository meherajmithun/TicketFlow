name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy API to Render
        # Trigger a Render deploy hook stored as a repository secret.
        # Set RENDER_DEPLOY_HOOK_API in Settings → Secrets → Actions.
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_API }}" ]; then
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}" \
              -H "Accept: application/json" \
              && echo "API deploy triggered"
          else
            echo "RENDER_DEPLOY_HOOK_API secret not set – skipping API deploy"
          fi

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build -w @ticketflow/web

      - name: Deploy web to Netlify
        # Requires NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID in repository secrets.
        # Install Netlify CLI and deploy the built dist folder.
        run: |
          if [ -n "${{ secrets.NETLIFY_AUTH_TOKEN }}" ]; then
            npm install -g netlify-cli --silent
            netlify deploy \
              --auth "${{ secrets.NETLIFY_AUTH_TOKEN }}" \
              --site "${{ secrets.NETLIFY_SITE_ID }}" \
              --dir apps/web/dist \
              --prod \
              --message "Deploy from GitHub Actions (commit ${{ github.sha }})"
          else
            echo "NETLIFY_AUTH_TOKEN secret not set – skipping web deploy"
          fi

